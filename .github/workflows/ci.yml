name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly dependency drift check

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint + types + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check app tests scripts

      - name: Ruff format check
        run: ruff format --check app tests scripts

      - name: Mypy
        run: mypy app

      - name: Tests + coverage
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  security:
    name: security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install scanners
        run: pip install "bandit[toml]" pip-audit

      - name: Bandit (static analysis)
        run: bandit -q -c pyproject.toml -r app

      - name: pip-audit (dependency CVEs)
        run: pip-audit -r requirements.txt

      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    name: image build + trivy
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t rwo-api:ci .

      - name: DEBUG find setuptools
        run: docker run --rm --user 0 --entrypoint sh rwo-api:ci -c 'find / -xdev \( -iname "setuptools*" -o -iname "*.whl" \) -not -path "*/_vendor/*" 2>/dev/null | grep -v "setuptools/" '

      - name: Trivy filesystem + image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rwo-api:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Smoke test the container
        run: |
          docker run -d --name rwo -p 8000:8000 \
            -e RWO_ENV=dev -e RWO_DATABASE_URL=sqlite+aiosqlite:///./rwo.db rwo-api:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8000/health && break || sleep 2
          done
          curl -fsS http://localhost:8000/health | grep -q '"status":"ok"'
          docker rm -f rwo
