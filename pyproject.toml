[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "restaurant-workforce-optimizer"
version = "1.0.0"
description = "Demand-forecast driven shift scheduling for restaurants: FastAPI, scikit-learn, MILP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Md Zulkar Nine" }]
keywords = ["scheduling", "operations-research", "forecasting", "fastapi", "milp"]

dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27",
  "sqlalchemy[asyncio]>=2.0.25,<3.0",
  "aiosqlite>=0.19",
  "pydantic>=2.6,<3.0",
  "pydantic-settings>=2.2",
  "email-validator>=2.1",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8,<3.0",
  "pulp>=2.8,<4.0",
  "scikit-learn>=1.4",
  "numpy>=1.26",
  "joblib>=1.3",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "httpx>=0.27",
  "ruff>=0.4",
  "mypy>=1.9",
  "bandit[toml]>=1.7",
  "pip-audit>=2.7",
  "types-python-dateutil",
]

[project.urls]
Homepage = "https://github.com/zulkar94/Dynamic-Restaurant-Workforce-Optimization"
Issues = "https://github.com/zulkar94/Dynamic-Restaurant-Workforce-Optimization/issues"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
  "ignore::DeprecationWarning:pulp.*",
]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy async switches into greenlets; without this, post-await lines look uncovered
concurrency = ["thread", "greenlet"]
omit = ["app/web/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "ASYNC"]
ignore = ["S101", "B008"]  # asserts in tests; FastAPI Depends in defaults

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"scripts/*" = ["S311"]  # PRNG is for synthetic demo data, not crypto

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
ignore_missing_imports = true
disallow_untyped_defs = false
plugins = []

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build"]
